name: CD

# Builds the app image, pushes it to GitHub Container Registry (free) and redeploys the VM.
# Deployment is GATED: it starts only after the CI workflow (unit tests, data validation and the
# model evaluation gate) has finished successfully on main. A failed gate blocks the release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io - no extra secret needed

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Commit to deploy (the one CI validated)
        run: echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/awaazguard" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: awaazguard-deploy ${{ env.SHA }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://${{ secrets.VM_HOST }}/api/health && exit 0
            sleep 10
          done
          echo "App did not become healthy" && exit 1
